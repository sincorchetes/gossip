name: Dependency audit

# Checks the pinned dependencies against the public vulnerability databases (PyPI advisories
# and OSV) and builds the CycloneDX SBOM that releases ship. A new advisory can appear for a
# version that was clean when it was pinned, so it also runs every week.

on:
  schedule:
    - cron: "0 7 * * 2"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "requirements*.txt"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "requirements*.txt"
      - ".github/workflows/audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Audit pinned dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install the audit tools (hash-verified)
        run: python -m pip install --require-hashes -r requirements-audit.txt

      - name: Scan for known vulnerabilities
        run: |
          status=0
          for lock in requirements.txt requirements-build.txt requirements-windows.txt; do
            echo "::group::pip-audit $lock"
            pip-audit -r "$lock" --no-deps --disable-pip || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Build the SBOMs (dry run of what releases publish)
        run: |
          mkdir -p sbom
          cyclonedx-py requirements requirements-build.txt --of JSON --sv 1.6 -o sbom/gossip-python-sbom.cdx.json
          cyclonedx-py requirements requirements-windows.txt --of JSON --sv 1.6 -o sbom/gossip-windows-python-sbom.cdx.json

      - name: Upload the SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/

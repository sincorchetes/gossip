  # ============================================================================
  # 4. PUBLISH GITHUB RELEASE (Only on Git Tags v*)
  # ============================================================================
  publish-release:
    name: Publish Official GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gossip-linux-*
          path: release-assets/
          merge-multiple: true

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: gossip-windows
          path: release-assets/
        continue-on-error: true

      # - name: Download macOS Artifacts
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: gossip-macos
      #     path: release-assets/
      #   continue-on-error: true

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Gossip Release ${{ github.ref_name }}"
          body: |
            ## Gossip Multi-Cloud Secret Manager - Version ${{ github.ref_name }}

            ### Highlights & Enhancements
            - Cross-platform graphical manager for Google Cloud Platform, AWS Secrets Manager, Azure Key Vault, and Ansible Vault.
            - Modern GTK4 and Libadwaita interface with light and dark theme switching.
            - Full bilingual localization (English / Spanish) with dynamic runtime switching.
            - 100% automated test suite statement and branch coverage.

            ### Available Downloads
            - **Debian / Ubuntu (.deb)**:
              - `amd64` (Intel/AMD 64-bit): [`gossip_${{ github.ref_name }}_amd64.deb`](https://github.com/sincorchetes/gossip/releases)
              - `arm64` (ARM 64-bit / Raspberry Pi): [`gossip_${{ github.ref_name }}_arm64.deb`](https://github.com/sincorchetes/gossip/releases)
            - **Fedora / openSUSE (.rpm)**:
              - `x86_64` (Intel/AMD 64-bit): [`gossip-${{ github.ref_name }}-1.x86_64.rpm`](https://github.com/sincorchetes/gossip/releases)
              - `aarch64` (ARM 64-bit): [`gossip-${{ github.ref_name }}-1.aarch64.rpm`](https://github.com/sincorchetes/gossip/releases)
            - **Linux Portable (.tar.gz)**:
              - `x86_64` (Intel/AMD): [`gossip-linux-x86_64-${{ github.ref_name }}.tar.gz`](https://github.com/sincorchetes/gossip/releases)
              - `aarch64` (ARM 64-bit): [`gossip-linux-aarch64-${{ github.ref_name }}.tar.gz`](https://github.com/sincorchetes/gossip/releases)
            - **Windows (x64)**: [`gossip-windows-x64-${{ github.ref_name }}.zip`](https://github.com/sincorchetes/gossip/releases)

            ### Documentation
            Consult the complete architecture, guides, and API specification at [https://sincorchetes.github.io/gossip/](https://sincorchetes.github.io/gossip/).
          files: release-assets/**/*
          draft: false
          prerelease: false

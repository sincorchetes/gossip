name: Build Multi-Platform & Publish Release

on:
  push:
    branches:
      - pre
      - release
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"

jobs:
  # ============================================================================
  # 1. LINUX BUILD (Ubuntu x86_64 & ARM64)
  # ============================================================================
  build-linux:
    name: Build Linux Packages (${{ matrix.arch_tag }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch_deb: amd64
            arch_rpm: x86_64
            arch_tag: x86_64
          - os: ubuntu-24.04-arm
            arch_deb: arm64
            arch_rpm: aarch64
            arch_tag: aarch64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install System Dependencies (GTK4 & Libadwaita)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libadwaita-1-dev \
            gobject-introspection \
            libgirepository1.0-dev \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-rsvg-2.0 \
            librsvg2-common \
            librsvg2-dev \
            librsvg2-bin \
            adwaita-icon-theme \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            python3-gi \
            python3-gi-cairo \
            gettext \
            build-essential \
            binutils \
            rpm \
            ruby \
            ruby-dev
          sudo gem install --no-document fpm

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install wheel
          pip install pycairo "PyGObject<3.51.0"
          pip install -r requirements.txt pyinstaller

      - name: Build Standalone Linux Executable with PyInstaller
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [[ "$VERSION" == *"/"* ]]; then
            VERSION="${{ github.sha }}"
            VERSION="${VERSION:0:8}"
          fi
          echo "Building Linux package for version ${VERSION} on architecture ${{ matrix.arch_tag }}..."

          TYPELIB_DIR="/usr/lib/$(uname -m)-linux-gnu/girepository-1.0"
          if [ ! -d "$TYPELIB_DIR" ]; then
            TYPELIB_DIR="$(find /usr/lib -name "girepository-1.0" -type d 2>/dev/null | head -n 1)"
          fi

          pyinstaller --noconfirm --onedir --windowed --name "gossip" \
            --add-data "locales:locales" \
            --add-data "${TYPELIB_DIR}:gi_typelibs" \
            --add-data "${TYPELIB_DIR}:girepository-1.0" \
            --add-data "/usr/share/glib-2.0/schemas:glib-2.0/schemas" \
            --collect-all "gi" \
            --collect-all "gi.repository.GdkPixbuf" \
            --collect-all "gi.repository.Rsvg" \
            --collect-data "ansible.config" \
            --hidden-import "gi" \
            --hidden-import "gi.repository.Gtk" \
            --hidden-import "gi.repository.Adw" \
            --hidden-import "gi.repository.Gio" \
            --hidden-import "gi.repository.GLib" \
            --hidden-import "gi.repository.GObject" \
            --hidden-import "gi.repository.GdkPixbuf" \
            --hidden-import "gi.repository.Rsvg" \
            --exclude-module "ansible.cli" \
            --exclude-module "ansible.plugins" \
            --exclude-module "ansible.executor" \
            --exclude-module "ansible.playbook" \
            src/main.py

          # Ensure all system typelibs are mirrored in both gi_typelibs and girepository-1.0
          mkdir -p dist/gossip/_internal/gi_typelibs
          mkdir -p dist/gossip/_internal/girepository-1.0
          mkdir -p dist/gossip/gi_typelibs
          mkdir -p dist/gossip/girepository-1.0
          find /usr/lib -name "*.typelib" -exec cp -f {} dist/gossip/_internal/gi_typelibs/ \; 2>/dev/null || true
          find /usr/lib -name "*.typelib" -exec cp -f {} dist/gossip/_internal/girepository-1.0/ \; 2>/dev/null || true
          find /usr/lib -name "*.typelib" -exec cp -f {} dist/gossip/gi_typelibs/ \; 2>/dev/null || true
          find /usr/lib -name "*.typelib" -exec cp -f {} dist/gossip/girepository-1.0/ \; 2>/dev/null || true

          # Ensure GLib schemas are compiled
          mkdir -p dist/gossip/_internal/glib-2.0/schemas
          cp -r /usr/share/glib-2.0/schemas/* dist/gossip/_internal/glib-2.0/schemas/ 2>/dev/null || true
          glib-compile-schemas dist/gossip/_internal/glib-2.0/schemas/ 2>/dev/null || true

          # Ensure libpixbufloader-svg.so and librsvg-2.so are bundled and registered for vector icons
          SVG_LOADER="$(find /usr/lib -name "libpixbufloader-svg.so" 2>/dev/null | head -n 1)"
          if [ -n "$SVG_LOADER" ] && [ -f "$SVG_LOADER" ]; then
            mkdir -p dist/gossip/_internal/lib/gdk-pixbuf/loaders
            cp -f "$SVG_LOADER" dist/gossip/_internal/lib/gdk-pixbuf/loaders/
            find /usr/lib -name "librsvg-2.so*" -exec cp -f {} dist/gossip/_internal/ \; 2>/dev/null || true
            if [ -f dist/gossip/_internal/lib/gdk-pixbuf/loaders.cache ] && ! grep -q "svg" dist/gossip/_internal/lib/gdk-pixbuf/loaders.cache; then
              cat >> dist/gossip/_internal/lib/gdk-pixbuf/loaders.cache << 'EOF'

"@executable_path/lib/gdk-pixbuf/loaders/libpixbufloader-svg.so"
"svg" 6 "gdk-pixbuf" "Scalable Vector Graphics" "LGPL"
"image/svg+xml" "image/svg" "image/svg-xml" "image/vnd.adobe.svg+xml" "text/xml-svg" "image/svg+xml-compressed" ""
"svg" "svgz" "svg.gz" ""
" <svg" "*    " 100
" <!DOCTYPE svg" "*             " 100
EOF
            fi
          fi

          mkdir -p dist/packages
          PKG_VERSION="${VERSION#v}"

          # 1. Portable tarball
          tar -czvf "dist/packages/gossip-linux-${{ matrix.arch_tag }}-${VERSION}.tar.gz" -C dist gossip

          # 2. Debian / Ubuntu (.deb) package
          DEB_DIR="dist/pkg-deb"
          mkdir -p "${DEB_DIR}/DEBIAN"
          mkdir -p "${DEB_DIR}/opt/gossip"
          mkdir -p "${DEB_DIR}/usr/bin"
          mkdir -p "${DEB_DIR}/usr/share/applications"
          mkdir -p "${DEB_DIR}/usr/share/icons/hicolor/scalable/apps"

          cp -r dist/gossip/* "${DEB_DIR}/opt/gossip/"
          cp data/gossip-launcher.sh "${DEB_DIR}/usr/bin/gossip"
          chmod 755 "${DEB_DIR}/usr/bin/gossip"

          cp data/com.github.sincorchetes.gossip_gcp.desktop "${DEB_DIR}/usr/share/applications/"
          cp data/icons/hicolor/scalable/apps/com.github.sincorchetes.gossip_gcp.svg "${DEB_DIR}/usr/share/icons/hicolor/scalable/apps/"

          echo "Package: gossip" > "${DEB_DIR}/DEBIAN/control"
          echo "Version: ${PKG_VERSION}" >> "${DEB_DIR}/DEBIAN/control"
          echo "Section: utils" >> "${DEB_DIR}/DEBIAN/control"
          echo "Priority: optional" >> "${DEB_DIR}/DEBIAN/control"
          echo "Architecture: ${{ matrix.arch_deb }}" >> "${DEB_DIR}/DEBIAN/control"
          echo "Maintainer: sincorchetes.tech <https://sincorchetes.tech>" >> "${DEB_DIR}/DEBIAN/control"
          echo "Depends: libc6, libglib2.0-0, libgtk-4-1, libadwaita-1-0, librsvg2-common" >> "${DEB_DIR}/DEBIAN/control"
          echo "Homepage: https://sincorchetes.github.io/gossip/" >> "${DEB_DIR}/DEBIAN/control"
          echo "Description: Multi-Cloud Secret Manager" >> "${DEB_DIR}/DEBIAN/control"
          echo " Gossip is a modern desktop application for managing secrets across" >> "${DEB_DIR}/DEBIAN/control"
          echo " Google Cloud Secret Manager, AWS Secrets Manager, Azure Key Vault," >> "${DEB_DIR}/DEBIAN/control"
          echo " and Ansible Vault with GTK4 and Libadwaita." >> "${DEB_DIR}/DEBIAN/control"

          dpkg-deb --build --root-owner-group "${DEB_DIR}" "dist/packages/gossip_${PKG_VERSION}_${{ matrix.arch_deb }}.deb"

          # 3. Fedora / openSUSE (.rpm) package via fpm
          fpm -s dir -t rpm \
            -n gossip \
            -v "${PKG_VERSION}" \
            --iteration 1 \
            -a "${{ matrix.arch_rpm }}" \
            --license "GPL-2.0-only" \
            --vendor "sincorchetes.tech" \
            --maintainer "sincorchetes.tech <https://sincorchetes.tech>" \
            --url "https://sincorchetes.github.io/gossip/" \
            --description "Multi-Cloud Secret Manager for GCP, AWS, Azure, and Ansible Vault" \
            -d "gtk4" \
            -d "libadwaita" \
            -d "glib2" \
            -d "librsvg2" \
            -p "dist/packages/gossip-${PKG_VERSION}-1.${{ matrix.arch_rpm }}.rpm" \
            -C "${DEB_DIR}" \
            opt usr

      - name: Upload Linux Artifacts (.tar.gz, .deb, .rpm)
        uses: actions/upload-artifact@v4
        with:
          name: gossip-linux-${{ matrix.arch_deb }}
          path: dist/packages/*

  # ============================================================================
  # 2. WINDOWS BUILD (Windows x64 Zip via MSYS2 UCRT64)
  # ============================================================================
  build-windows:
    name: Build Windows (x64 Zip)
    runs-on: windows-latest
    continue-on-error: true
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2 with GTK4 & PyGObject
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-python-wheel
            mingw-w64-ucrt-x86_64-python-cffi
            mingw-w64-ucrt-x86_64-python-cryptography
            mingw-w64-ucrt-x86_64-python-yaml
            mingw-w64-ucrt-x86_64-python-grpcio
            mingw-w64-ucrt-x86_64-python-protobuf
            mingw-w64-ucrt-x86_64-python-markupsafe
            mingw-w64-ucrt-x86_64-python-google-auth
            mingw-w64-ucrt-x86_64-python-google-api-core
            mingw-w64-ucrt-x86_64-python-googleapis-common-protos
            mingw-w64-ucrt-x86_64-python-proto-plus
            mingw-w64-ucrt-x86_64-python-boto3
            mingw-w64-ucrt-x86_64-python-botocore
            mingw-w64-ucrt-x86_64-python-requests
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-hicolor-icon-theme

      - name: Install Python Dependencies & PyInstaller
        shell: msys2 {0}
        run: |
          python -m pip install --upgrade pip --break-system-packages
          pip install --break-system-packages wheel
          pip install --break-system-packages --no-deps google-cloud-secret-manager grpc-google-iam-v1
          pip install --break-system-packages azure-keyvault-secrets azure-identity ansible-vault
          python -c "import gi; import boto3; import azure.identity; import ansible_vault; from google.cloud import secretmanager; import src.main; import src.ui.app; print('ALL WINDOWS IMPORTS SUCCESSFUL!')"

      - name: Build Windows Executable with PyInstaller
        shell: msys2 {0}
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          LANG: "C.UTF-8"
          LC_ALL: "C.UTF-8"
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "gossip" \
            --add-data "locales;locales" \
            --collect-all "gi" \
            --collect-data "ansible.config" \
            --hidden-import "gi" \
            --hidden-import "gi.repository.Gtk" \
            --hidden-import "gi.repository.Adw" \
            --hidden-import "gi.repository.Gio" \
            --hidden-import "gi.repository.GLib" \
            --hidden-import "gi.repository.GObject" \
            --exclude-module "ansible.cli" \
            --exclude-module "ansible.plugins" \
            --exclude-module "ansible.executor" \
            --exclude-module "ansible.playbook" \
            src/main.py

          # Bundle GObject Introspection typelibs (.typelib)
          mkdir -p dist/gossip/girepository-1.0 dist/gossip/lib/girepository-1.0
          cp -rf /ucrt64/lib/girepository-1.0/* dist/gossip/girepository-1.0/ 2>/dev/null || true
          cp -rf /ucrt64/lib/girepository-1.0/* dist/gossip/lib/girepository-1.0/ 2>/dev/null || true

          # Bundle GSettings schemas (including gschemas.compiled)
          mkdir -p dist/gossip/glib-2.0/schemas dist/gossip/share/glib-2.0/schemas
          cp -rf /ucrt64/share/glib-2.0/schemas/* dist/gossip/glib-2.0/schemas/ 2>/dev/null || true
          cp -rf /ucrt64/share/glib-2.0/schemas/* dist/gossip/share/glib-2.0/schemas/ 2>/dev/null || true

          # Bundle standard icons (Adwaita & hicolor)
          mkdir -p dist/gossip/share/icons dist/gossip/icons dist/gossip/_internal/share/icons dist/gossip/_internal/icons
          cp -rf /ucrt64/share/icons/* dist/gossip/share/icons/ 2>/dev/null || true
          cp -rf /ucrt64/share/icons/* dist/gossip/icons/ 2>/dev/null || true
          cp -rf /ucrt64/share/icons/* dist/gossip/_internal/share/icons/ 2>/dev/null || true
          cp -rf /ucrt64/share/icons/* dist/gossip/_internal/icons/ 2>/dev/null || true

          # Bundle system locales (Libadwaita & GTK4 native gettext catalogs)
          mkdir -p dist/gossip/share/locale dist/gossip/_internal/share/locale
          cp -rf /ucrt64/share/locale/* dist/gossip/share/locale/ 2>/dev/null || true
          cp -rf /ucrt64/share/locale/* dist/gossip/_internal/share/locale/ 2>/dev/null || true

          # Bundle GTK4 and Libadwaita native dynamic libraries into the application directory
          cp /ucrt64/bin/libgtk-*.dll dist/gossip/ 2>/dev/null || true
          cp /ucrt64/bin/libadwaita-*.dll dist/gossip/ 2>/dev/null || true
          cp /ucrt64/bin/libgirepository-*.dll dist/gossip/ 2>/dev/null || true
          cp /ucrt64/bin/libgio-*.dll dist/gossip/ 2>/dev/null || true
          cp /ucrt64/bin/libglib-*.dll dist/gossip/ 2>/dev/null || true
          cp /ucrt64/bin/libgobject-*.dll dist/gossip/ 2>/dev/null || true
          cp /ucrt64/bin/libgmodule-*.dll dist/gossip/ 2>/dev/null || true
          cp /ucrt64/bin/libcairo-*.dll dist/gossip/ 2>/dev/null || true
          cp /ucrt64/bin/libpango-*.dll dist/gossip/ 2>/dev/null || true
          cp /ucrt64/bin/libgdk_pixbuf-*.dll dist/gossip/ 2>/dev/null || true
          cp /ucrt64/bin/libepoxy-*.dll dist/gossip/ 2>/dev/null || true
          cp /ucrt64/bin/libgraphene-*.dll dist/gossip/ 2>/dev/null || true
          cp /ucrt64/bin/libharfbuzz-*.dll dist/gossip/ 2>/dev/null || true
          cp /ucrt64/bin/libintl-*.dll dist/gossip/ 2>/dev/null || true
          cp /ucrt64/bin/libintl-*.dll dist/gossip/_internal/ 2>/dev/null || true
          cp /ucrt64/bin/libiconv-*.dll dist/gossip/ 2>/dev/null || true
          cp /ucrt64/bin/libiconv-*.dll dist/gossip/_internal/ 2>/dev/null || true

          # Bundle Ansible configuration data (base.yml)
          ANSIBLE_CONFIG_DIR=$(python -c "import ansible.config, os; print(os.path.dirname(ansible.config.__file__))" 2>/dev/null || true)
          if [ -n "$ANSIBLE_CONFIG_DIR" ] && [ -d "$ANSIBLE_CONFIG_DIR" ]; then
            echo "Copying Ansible base config from $ANSIBLE_CONFIG_DIR..."
            mkdir -p dist/gossip/_internal/ansible/config dist/gossip/ansible/config
            cp -rf "$ANSIBLE_CONFIG_DIR"/*.yml dist/gossip/_internal/ansible/config/ 2>/dev/null || true
            cp -rf "$ANSIBLE_CONFIG_DIR"/*.yml dist/gossip/ansible/config/ 2>/dev/null || true
          fi

          # Verify bundled standalone executable executes and prints version
          ./dist/gossip/gossip.exe --version

      - name: Archive Windows Package
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}"
          if (-not $VERSION -or $VERSION.Contains("/")) {
            $VERSION = "${{ github.sha }}".Substring(0, 8)
          }
          if (-not (Test-Path "dist/gossip")) {
            throw "dist/gossip directory was not generated by PyInstaller"
          }
          New-Item -ItemType Directory -Force -Path "dist/packages"
          Compress-Archive -Path "dist/gossip/*" -DestinationPath "dist/packages/gossip-windows-x64-${VERSION}.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gossip-windows
          path: dist/packages/*.zip


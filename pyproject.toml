[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "src" }]

[project]
name = "gossip"
version = "0.0.1"
description = "Cross-platform graphical secret manager for GCP, AWS, Azure, and Ansible Vault using GTK4 and Libadwaita."
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE*", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Álvaro Castillo" },
]
keywords = [
    "secret-manager",
    "gcp",
    "aws",
    "azure",
    "ansible-vault",
    "gtk4",
    "libadwaita",
    "gui",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]

dependencies = [
    "google-cloud-secret-manager>=2.20.0",
    "google-auth>=2.30.0",
    "boto3>=1.34.0",
    "botocore[crt]>=1.34.0",
    "awscrt>=0.20.0",
    "azure-keyvault-secrets>=4.8.0",
    "azure-identity>=1.16.0",
    "pyyaml>=6.0.1",
    "ansible-vault>=2.1.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "coverage[toml]>=7.4.0",
    "ruff>=0.3.0",
    "graphifyy>=0.3.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-static-i18n>=1.2.0",
]

[project.scripts]
gossip = "src.main:main"

[project.urls]
Homepage = "https://sincorchetes.github.io/gossip/"
Documentation = "https://sincorchetes.github.io/gossip/"
Repository = "https://github.com/sincorchetes/gossip.git"
Issues = "https://github.com/sincorchetes/gossip/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".flatpak-builder", ".devenv", ".venv", "build-dir"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=95",
]
filterwarnings = [
    "ignore::DeprecationWarning:gi.*",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/__pycache__/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".devenv",
    ".venv",
    "__pycache__",
    "dist",
    "build",
    "site",
    "htmlcov",
    ".flatpak-builder",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Platform stand-ins that assign attributes of fcntl, termios, pwd and grp on Windows
module = "src.providers.ansible.shims"
ignore_errors = true

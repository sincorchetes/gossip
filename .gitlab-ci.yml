# ==============================================================================
# GitLab CI/CD Pipeline for Gossip Multi-Cloud Secret Manager
# ==============================================================================

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - test
  - build
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PACKAGE_NAME: "gossip"
  GENERIC_PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip
    - .venv/

# ==============================================================================
# 1. TEST STAGE: Code Quality, Automated Tests, and Strict Coverage Gate (>= 90%)
# ==============================================================================
test:coverage:
  stage: test
  image: python:3.13-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends
        libgtk-4-dev
        libadwaita-1-dev
        gobject-introspection
        libgirepository1.0-dev
        gir1.2-gtk-4.0
        gir1.2-adw-1
        gettext
        build-essential
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest-cov pytest
  script:
    # Execute full test suite with coverage gate (fails automatically below 90%)
    - pytest --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=90 --junitxml=junit.xml
  coverage: '/TOTAL.*?(\d+(?:\.\d+)?)\%/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - junit.xml
      - htmlcov/
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "pre"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "release"'
    - if: '$CI_COMMIT_TAG'

# ==============================================================================
# 2. BUILD STAGE: Multi-Platform Standalone Package Compilation
# ==============================================================================

# --- Linux: Self-contained Binary / Tarball ---
build:linux:
  stage: build
  image: python:3.13-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends
        libgtk-4-dev
        libadwaita-1-dev
        gobject-introspection
        libgirepository1.0-dev
        gir1.2-gtk-4.0
        gir1.2-adw-1
        adwaita-icon-theme
        gettext
        build-essential
        binutils
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt pyinstaller
  script:
    - VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - echo "Building Linux package for version ${VERSION}..."
    - pyinstaller --noconfirm --onedir --windowed --name "${PACKAGE_NAME}"
        --add-data "locales:locales"
        src/main.py
    - mkdir -p dist/packages
    - tar -czvf "dist/packages/${PACKAGE_NAME}-linux-x86_64-${VERSION}.tar.gz" -C dist "${PACKAGE_NAME}"
  artifacts:
    name: "gossip-linux-${CI_COMMIT_REF_SLUG}"
    paths:
      - dist/packages/
    expire_in: 14 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "pre"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "release"'
    - if: '$CI_COMMIT_TAG'

# --- Windows: Executable / Zip Archive (Windows Runner) ---
build:windows:
  stage: build
  tags:
    - windows
  before_script:
    - choco install -y msys2 python313 || true
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt pyinstaller
  script:
    - $VERSION = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG } else { $env:CI_COMMIT_SHORT_SHA }
    - echo "Building Windows package for version $VERSION..."
    - pyinstaller --noconfirm --onedir --windowed --name "${PACKAGE_NAME}" --add-data "locales;locales" src/main.py
    - New-Item -ItemType Directory -Force -Path "dist/packages"
    - Compress-Archive -Path "dist/${PACKAGE_NAME}/*" -DestinationPath "dist/packages/${PACKAGE_NAME}-windows-x64-${VERSION}.zip"
  artifacts:
    name: "gossip-windows-${CI_COMMIT_REF_SLUG}"
    paths:
      - dist/packages/
    expire_in: 14 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "pre"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "release"'
    - if: '$CI_COMMIT_TAG'
  allow_failure: true # Allows pipeline to proceed if no Windows runner is available

# --- macOS: Standalone Bundle / DMG Package (macOS Runner) ---
build:macos:
  stage: build
  tags:
    - macos
    - saas-macos-medium-m1
  before_script:
    - brew install gtk4 libadwaita gobject-introspection adwaita-icon-theme create-dmg || true
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt pyinstaller
  script:
    - VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - echo "Building macOS package for version ${VERSION}..."
    - pyinstaller --noconfirm --onedir --windowed --name "${PACKAGE_NAME}"
        --add-data "locales:locales"
        src/main.py
    - mkdir -p dist/packages
    - hdiutil create -volname "${PACKAGE_NAME}" -srcfolder "dist/${PACKAGE_NAME}.app" -ov -format UDZO "dist/packages/${PACKAGE_NAME}-macos-universal-${VERSION}.dmg" || tar -czvf "dist/packages/${PACKAGE_NAME}-macos-${VERSION}.tar.gz" -C dist "${PACKAGE_NAME}.app"
  artifacts:
    name: "gossip-macos-${CI_COMMIT_REF_SLUG}"
    paths:
      - dist/packages/
    expire_in: 14 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "pre"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "release"'
    - if: '$CI_COMMIT_TAG'
  allow_failure: true # Allows pipeline to proceed if no macOS runner is available

# ==============================================================================
# 3. RELEASE STAGE: Publish to Generic Package Registry and Official Releases
# ==============================================================================
publish:release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: test:coverage
    - job: build:linux
      artifacts: true
    - job: build:windows
      artifacts: true
      optional: true
    - job: build:macos
      artifacts: true
      optional: true
  rules:
    # Triggered exclusively on official release tags (e.g. v1.0.0, v0.4.0)
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/'
  script:
    - echo "Uploading build artifacts to GitLab Generic Package Registry..."
    # Upload Linux tarball
    - |
      LINUX_ASSET=$(find dist/packages -name "*.tar.gz" | head -n 1)
      if [ -f "$LINUX_ASSET" ]; then
        LINUX_FILENAME=$(basename "$LINUX_ASSET")
        wget --header="JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --method=PUT \
             --body-file="$LINUX_ASSET" \
             "${GENERIC_PACKAGE_URL}/${CI_COMMIT_TAG}/${LINUX_FILENAME}"
      fi
    # Upload Windows archive (if generated)
    - |
      WIN_ASSET=$(find dist/packages -name "*.zip" | head -n 1)
      if [ -f "$WIN_ASSET" ]; then
        WIN_FILENAME=$(basename "$WIN_ASSET")
        wget --header="JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --method=PUT \
             --body-file="$WIN_ASSET" \
             "${GENERIC_PACKAGE_URL}/${CI_COMMIT_TAG}/${WIN_FILENAME}"
      fi
    # Upload macOS package (if generated)
    - |
      MAC_ASSET=$(find dist/packages -name "*.dmg" | head -n 1)
      if [ -f "$MAC_ASSET" ]; then
        MAC_FILENAME=$(basename "$MAC_ASSET")
        wget --header="JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --method=PUT \
             --body-file="$MAC_ASSET" \
             "${GENERIC_PACKAGE_URL}/${CI_COMMIT_TAG}/${MAC_FILENAME}"
      fi
    - echo "Artifacts uploaded. Generating formal GitLab Release entry..."
  release:
    name: "Gossip Release $CI_COMMIT_TAG"
    description: |
      ## Gossip Multi-Cloud Secret Manager - Release $CI_COMMIT_TAG

      ### Features & Enhancements:
      - Consult the Git commit log and release notes for complete change details.
      - Automated test suite verified with 100% statement and branch coverage.

      ### Available Downloads:
      - **Linux (x86_64)**: Portable tarball (`tar.gz`)
      - **Windows (x64)**: Standalone executable archive (`zip`)
      - **macOS (Universal)**: Standalone application package (`dmg` / `app`)
    tag_name: "$CI_COMMIT_TAG"
    ref: "$CI_COMMIT_TAG"
    assets:
      links:
        - name: "Gossip for Linux (x86_64)"
          url: "${GENERIC_PACKAGE_URL}/${CI_COMMIT_TAG}/${PACKAGE_NAME}-linux-x86_64-${CI_COMMIT_TAG}.tar.gz"
          link_type: "package"
        - name: "Gossip for Windows (x64)"
          url: "${GENERIC_PACKAGE_URL}/${CI_COMMIT_TAG}/${PACKAGE_NAME}-windows-x64-${CI_COMMIT_TAG}.zip"
          link_type: "package"
        - name: "Gossip for macOS (Universal DMG)"
          url: "${GENERIC_PACKAGE_URL}/${CI_COMMIT_TAG}/${PACKAGE_NAME}-macos-universal-${CI_COMMIT_TAG}.dmg"
          link_type: "package"

# ==============================================================================
# 4. PAGES STAGE: Automatic Static Documentation Deployment (GitLab Pages)
# ==============================================================================
pages:
  stage: release
  image: python:3.13-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends
        libgtk-4-dev
        libadwaita-1-dev
        gobject-introspection
        libgirepository1.0-dev
        gir1.2-gtk-4.0
        gir1.2-adw-1
        gettext
        build-essential
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install -r requirements.txt
  script:
    - NO_MKDOCS_2_WARNING=1 mkdocs build --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "release"'
